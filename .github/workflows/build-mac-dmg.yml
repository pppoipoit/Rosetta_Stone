name: Build macOS DMG

# ============================================================================
# Rosetta Stone — build → sign → DMG → release
# ============================================================================
# โครงสร้าง ลำดับ step และรูปแบบคอมเมนต์ถูกยกมาจาก workflow ต้นแบบที่ build
# แอป .NET (setup-dotnet → dotnet publish → ประกอบ .app → codesign →
# create-dmg → ตรวจ DMG → upload-artifact → release job)
# ต่างกันแค่กลไกการ build ซึ่งเปลี่ยนเป็น
#     brew install xcodegen → xcodegen generate → xcodebuild
# ส่วน trigger, matrix, การเซ็น ad-hoc, create-dmg, การตรวจ DMG,
# การอัปโหลด artifact และ release job คงเดิมทั้งหมด
#
# ข้อสำคัญ: .xcodeproj ไม่ได้ commit ไว้ — project.yml คือไฟล์ต้นฉบับเดียว
# และถูก generate ใหม่ทุกครั้งที่ CI ทำงาน
# ============================================================================

on:
  # ปุ่ม "Run workflow" ในหน้า Actions
  workflow_dispatch:
  # push tag ที่ขึ้นต้นด้วย v เช่น v0.1.0 -> ให้ build และ release อัตโนมัติ
  push:
    tags:
      - 'v*'

# ปล่อยสิทธิ์เฉพาะที่จำเป็นต่อ release job
permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # job เทสต์ — รัน MacProfile harness ก่อน build
  #
  # รันบน ubuntu-latest ไม่ใช่ macos-latest เพราะ:
  #  - harness เป็น pure logic (ไม่มี Process/Darwin) จึงรันได้ทุกแพลตฟอร์ม
  #  - ubuntu-latest มี Swift 6.4 ติดตั้งมาอยู่แล้ว ไม่ต้องเพิ่ม setup-swift action
  #  - ถ้าพังตรงนี้ เราจะเสียเวลา build ทั้ง 2 สถาปัตยกรรมไปเปล่า ๆ
  #
  # Auto Boot เป็นกฎเดียวในแอปที่ผิดแล้วเขียนค่า firmware ถาวร การ gate ไว้ตรงนี้
  # จึงคุ้มกว่าการตรวจหลังจบ (ADR-008)
  # ----------------------------------------------------------------------
  test:
    name: Test (MacProfile harness)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ใช้คำสั่งเดียวกับที่ระบุไว้ใน header ของไฟล์ และใน README
      # ถ้าสองที่นี้ไม่ตรงกัน แปลว่าเอกสารเพี้ยน ไม่ใช่แค่ของตัวอย่าง
      - name: Compile and run MacProfile harness
        run: |
          set -euo pipefail
          swift --version
          swiftc -swift-version 5 -o macprofile-tests tests/MacProfileTests.swift
          ./macprofile-tests

  build:
    name: Build (${{ matrix.output_name }})
    # ต้องผ่าน harness ก่อน — build ทั้ง 2 สถาปัตยกรรมค่อยเริ่ม
    needs: test
    runs-on: macos-latest

    strategy:
      # ให้ทั้ง 2 สถาปัตยกรรม build ต่อกันแม้ตัวหนึ่งจะล้มเหลว
      fail-fast: false
      matrix:
        # arch        = ค่าที่ส่งให้ xcodebuild ผ่าน ARCHS= ในขั้นตอนที่ 4
        # output_name = ชื่อ .app ใน dist/ ชื่อไฟล์ .dmg และชื่อ artifact
        include:
          - arch: arm64
            output_name: RosettaStone-AppleSilicon
          - arch: x86_64
            output_name: RosettaStone-Intel

    steps:
      # ------------------------------------------------------------------
      # 1) ดึงซอร์สจาก repository
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2) [แทนที่ setup-dotnet] ติดตั้ง XcodeGen
      #    .xcodeproj ไม่ได้ commit ไว้ใน repo — project.yml คือไฟล์ต้นฉบับ
      #    เดียวของการตั้งค่า build ทั้งหมด และ CI สร้างมันใหม่ทุกครั้ง
      # ------------------------------------------------------------------
      - name: Install XcodeGen
        run: |
          brew install xcodegen

      # ------------------------------------------------------------------
      # 3) [แทนที่ dotnet restore] สร้าง .xcodeproj จาก project.yml
      #    ผลลัพธ์คือ RosettaStone.xcodeproj + scheme ชื่อ RosettaStone ที่ถูก
      #    mark เป็น shared ไว้ใน project.yml จึงมองเห็นได้จาก xcodebuild
      # ------------------------------------------------------------------
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          echo "---- targets ----"
          xcodebuild -list -project RosettaStone.xcodeproj

      # ------------------------------------------------------------------
      # 4) [แทนที่ dotnet publish] build แอปด้วย xcodebuild
      #    -configuration Release = โหมดแจกจ่าย
      #    -destination generic/platform=macOS บังคับให้ได้ตัวที่นำไป
      #      แจกจ่ายได้ ไม่ใช่ตัวสำหรับ simulator
      #    ARCHS + ONLY_ACTIVE_ARCH=NO บังคับสถาปัตยกรรมตาม matrix
      #    CODE_SIGNING_ALLOWED=NO เพราะเราเซ็นเองในขั้นตอนที่ 6 แบบ ad-hoc
      #      จึงไม่ต้องมี certificate บน runner
      # ------------------------------------------------------------------
      - name: Build Swift app (Release, ${{ matrix.arch }})
        run: |
          set -o pipefail
          xcodebuild \
            -project RosettaStone.xcodeproj \
            -scheme RosettaStone \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ------------------------------------------------------------------
      # 5) [แทนที่การประกอบ .app ด้วยมือ: mkdir + cat Info.plist + PkgInfo heredoc]
      #    ตอนนี้ Xcode สร้าง bundle ให้ครบทั้ง Info.plist, PkgInfo, binary
      #    executable และ Resources อยู่แล้ว จึงเหลือแค่ก๊อปมันออกมาไว้ใน
      #    dist/ โดยไม่เปลี่ยนชื่อ
      #    Info.plist มาจาก RosettaStone/Support/Info.plist ผ่านค่า
      #    INFOPLIST_FILE ใน project.yml และ LSMinimumSystemVersion ยังคงเป็น 10.15
      #
      #    Phase 8 — ชื่อ bundle ต้องเป็น RosettaStone.app เสมอ
      #    เดิมขั้นนี้ copy ไปเป็น dist/<output_name>.app ทำให้แอปที่ติดตั้ง
      #    ลงใน /Applications กลายเป็น RosettaStone-Intel.app / RosettaStone-AppleSilicon.app
      #    ซึ่งชื่อไฟล์ที่ผู้ใช้เห็นต้องไม่ขึ้นกับสถาปัตยกรรมเครื่อง
      #    suffix ของสถาปัตยกรรมอยู่เฉพาะชื่อไฟล์ .dmg และ artifact เท่านั้น
      #    (ขั้นที่ 10 จะ mount DMG แล้ว assert ชื่อนี้อีกชั้น กันไม่ให้มีการ rename กลับมา)
      # ------------------------------------------------------------------
      - name: Collect app bundle
        run: |
          set -euo pipefail
          BUNDLE="dist/RosettaStone.app"
          mkdir -p dist
          cp -R build/Build/Products/Release/RosettaStone.app "$BUNDLE"
          echo "---- เนื้อหาใน bundle ----"
          ls -l "$BUNDLE/Contents"

      # ------------------------------------------------------------------
      # 6) เซ็นแบบ ad-hoc (ไม่ใช้ Developer ID — ดู ADR-003)
      #    -deep ครอบทุก framework/nested code ที่อยู่ใน .app
      #    -f     เขียนทับลายเซ็นเดิม
      #    เป้าหมายคือ bundle ชื่อเดียว RosettaStone.app เหมือนขั้นที่ 5
      # ------------------------------------------------------------------
      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          BUNDLE="dist/RosettaStone.app"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --verbose=2 "$BUNDLE"

      # ------------------------------------------------------------------
      # 7) smoke test — ยิงแอปที่ build เสร็จแล้วจริง แล้วดูว่ามันรอด 5 วินาทีไหม
      #    บั๊กคลาสนี้เคยทำให้แอปตายทันทีตอนเปิด: AppDelegate ไม่ได้ override init()
      #    ทำให้ @NSApplicationDelegateAdaptor เรียก -init ที่ Swift สร้างเป็น stub
      #    ซึ่ง trap (EXC_BAD_INSTRUCTION / SIGILL) — compile ผ่าน แต่พังตอนรัน
      #    การรันจริงหลัง codesign จึงเป็น gate เดียวที่จับได้
      #
      #    - รัน 2 ครั้ง: ครั้งแรกเปิดปกติ (mode A) ครั้งที่สอง --menu-bar-only (mode B)
      #      เพราะสองโหมดเข้า init คนละทาง
      #    - uname -m เทียบกับ matrix.arch: runner รันสถาปัตยกรรมที่ตัวเองเป็นเท่านั้น
      #      ถ้าไม่ตรงก็ skip ไม่ใช่ fail (Intel ไม่รันบน Apple Silicon แบบ native)
      # ------------------------------------------------------------------
      - name: Smoke test (launch and stay alive)
        run: |
          set -uo pipefail
          BUNDLE="dist/RosettaStone.app"
          BIN="$BUNDLE/Contents/MacOS/RosettaStone"

          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" != "${{ matrix.arch }}" ]; then
            echo "::notice::skipping smoke test — leg builds ${{ matrix.arch }} but runner is ${RUNNER_ARCH}"
            exit 0
          fi

          for args in "" "--menu-bar-only"; do
            echo "---- launching: ${BIN} ${args} ----"
            rm -f smoke.log
            # shellcheck disable=SC2086
            "$BIN" $args > smoke.log 2>&1 &
            PID=$!
            sleep 5
            if kill -0 "$PID" 2>/dev/null; then
              echo "OK: alive after 5s (args: '${args}', pid ${PID})"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            else
              echo "::error::smoke test failed — process exited early (args: '${args}')"
              echo "---- captured output ----"
              cat smoke.log || true
              exit 1
            fi
          done
          echo "smoke test passed for both launch modes"

      # ------------------------------------------------------------------
      # 8) ติดตั้งเครื่องมือสร้าง DMG
      # ------------------------------------------------------------------
      - name: Install create-dmg
        run: |
          brew install create-dmg

      # ------------------------------------------------------------------
      # 9) สร้าง DMG แบบลากวางลง Applications
      #     --icon / --app-drop-link = ตำแหน่งไอคอนและลิงก์ /Applications
      #     --hide-extension         = ซ่อน .app ให้เห็นเป็นชื่อสะอาด
      #     BUNDLE                   = ชื่อ bundle เดียว RosettaStone.app ที่ติดตั้ง
      #                                แล้วลงใน /Applications ต้องเป็นชื่อนี้เสมอ
      #     ชื่อไฟล์ .dmg ยังคงใช้ suffix ตามสถาปัตยกรรมตามเดิม
      #     || true                  = ไม่ล้มเหลว เพราะ create-dmg มักเตือนเรื่อง
      #                              quarantine attribute / สิทธิ์บางอย่าง
      #                              บน runner ซึ่งไม่กระทบความถูกต้องของ DMG
      #                              (ขั้นตอนถัดไปยังตรวจไฟล์และเนื้อหาอีกชั้น)
      # ------------------------------------------------------------------
      - name: Create DMG
        run: |
          set -euo pipefail
          BUNDLE="dist/RosettaStone.app"
          create-dmg \
            --volname "Rosetta Stone Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "RosettaStone.app" 150 190 \
            --hide-extension "RosettaStone.app" \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "dist/${{ matrix.output_name }}.dmg" \
            "$BUNDLE" \
            || true

      # ------------------------------------------------------------------
      # 10) ตรวจสอบว่า DMG ถูกสร้างจริง และเนื้อหาข้างในถูกต้อง
      #     ชั้นที่ 1: ไฟล์ DMG มีอยู่และไม่ว่างเปล่า  (เดิม)
      #     ชั้นที่ 2 (Phase 8): mount แล้วตรวจว่าข้างในมี .app พอดีหนึ่งตัว
      #              และชื่อเป็น RosettaStone.app เสมอ ไม่ใช่ชื่อผสมสถาปัตยกรรม
      #              เพราะชื่อ bundle คือสิ่งที่ผู้ใช้เห็นใน /Applications
      #     detach เสมอ แม้ assertion จะ fail ก็ไม่ทิ้ง mount ค้างไว้
      # ------------------------------------------------------------------
      - name: Verify DMG
        run: |
          set -uo pipefail
          DMG="dist/${{ matrix.output_name }}.dmg"
          if [ ! -f "$DMG" ] || [ ! -s "$DMG" ]; then
            echo "::error::ไม่พบไฟล์ DMG ที่ ${DMG} (หรือไฟล์ว่างเปล่า)"
            echo "---- ไฟล์ใน dist ----"
            ls -lh dist || true
            exit 1
          fi
          echo "---- ขนาดไฟล์ ----"
          ls -lh "$DMG"

          # ---- ชั้นที่ 2: ตรวจเนื้อหาใน DMG ----
          MOUNT_POINT="$(mktemp -d /tmp/rs-dmg-check.XXXXXX)"
          # detach ให้แน่นอน แม้ขั้นตอนถัดไปจะ exit 1
          trap 'hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true; rmdir "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          if ! hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG" >/dev/null; then
            echo "::error::เปิด DMG ที่ ${DMG} ไม่สำเร็จ (hdiutil attach ล้มเหลว)"
            exit 1
          fi

          echo "---- เนื้อหาใน DMG ----"
          ls -1 "$MOUNT_POINT"

          # จับเฉพาะ .app ที่อยู่ระดับบนสุดของ volume (ไม่ลงไปนับข้างใน bundle)
          APPS="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print)"
          APP_COUNT="$(printf '%s\n' "$APPS" | grep -c '\.app$' || true)"
          APP_NAME="$(basename "$(printf '%s\n' "$APPS" | grep '\.app$' | head -n 1)" 2>/dev/null || true)"

          if [ "$APP_COUNT" != "1" ]; then
            echo "::error::คาดหวัง .app พอดี 1 ตัวใน ${DMG} แต่พบ ${APP_COUNT} ตัว"
            echo "$APPS"
            exit 1
          fi

          if [ "$APP_NAME" != "RosettaStone.app" ]; then
            echo "::error::ชื่อแอปใน ${DMG} ต้องเป็น RosettaStone.app แต่พบ ${APP_NAME}"
            echo "::error::ชื่อ bundle ที่ติดตั้งลง /Applications ต้องไม่มี suffix สถาปัตยกรรม"
            exit 1
          fi

          echo "OK: พบ .app ชื่อ RosettaStone.app พอดีหนึ่งตัวใน ${DMG}"

      # ------------------------------------------------------------------
      # 11) อัปโหลด DMG ขึ้นเป็น artifact ของ run นี้
      #     แยก artifact ตามชื่อสถาปัตยกรรม จะได้ไม่ทับกัน
      # ------------------------------------------------------------------
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}-dmg
          path: dist/${{ matrix.output_name }}.dmg
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # job สร้าง GitHub Release — ทำงานเฉพาะตอน push tag เท่านั้น
  # รอให้ harness (ผ่านทาง build) และ build ทั้งสองสถาปัตยกรรมเสร็จก่อน
  # ----------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # ดึง artifact ทั้งหมดจาก job build มาไว้ในเครื่องนี้
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: dmgs

      # สร้าง Release พร้อมไฟล์ .dmg ทั้งสองตัว
      # generate_release_notes: true = ให้ GitHub สร้าง release note อัตโนมัติ
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dmgs/**/*.dmg
          generate_release_notes: true
